name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install helper dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate KAPTURA product boundary
        run: python tests/validate_kaptura.py
      - name: Test local helpers
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile Python helpers
        run: python -m compileall -q .
      - name: Build and validate portable artifact
        run: python scripts/build_release.py --output dist
