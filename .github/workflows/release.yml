name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install helper dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate tag and product
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          python tests/validate_kaptura.py
          python -m unittest discover -s tests -p "test_*.py"
          python -m compileall -q .
      - name: Build portable release
        run: python scripts/build_release.py --output dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
