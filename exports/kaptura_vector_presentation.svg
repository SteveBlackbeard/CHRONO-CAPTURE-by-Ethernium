<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      
      .title { font-family: 'Orbitron', monospace; font-size: 32px; font-weight: 900; fill: #00F0FF; letter-spacing: 4px; }
      .sub { font-family: 'Fira Code', monospace; font-size: 14px; fill: #94A3B8; }
      
      .pulse-ring {
        animation: ringPulse 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      
      @keyframes ringPulse {
        0% { r: 60px; opacity: 0.9; stroke: #00FF9D; }
        100% { r: 180px; opacity: 0; stroke: #00F0FF; }
      }

      .glow-box {
        animation: boxGlow 4s infinite alternate;
      }

      @keyframes boxGlow {
        0% { stroke: #00F0FF; filter: drop-shadow(0 0 6px #00F0FF); }
        100% { stroke: #7000FF; filter: drop-shadow(0 0 10px #7000FF); }
      }
    </style>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306"/>
      <stop offset="50%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#010204"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="655" rx="12" fill="none" class="glow-box" stroke-width="2"/>

  <!-- Pulsing Vector Core -->
  <circle cx="600" cy="337" r="60" fill="none" stroke="#00FF9D" stroke-width="3" class="pulse-ring"/>
  <circle cx="600" cy="337" r="35" fill="#00F0FF" opacity="0.8"/>

  <text x="600" y="80" text-anchor="middle" class="title">KAPTURA Ω // VECTOR MOTION ENGINE</text>
  <text x="600" y="115" text-anchor="middle" class="sub">HERRAMIENTA 2: EXPORTADOR SVG VECTORIAL NATIVO A 120 FPS</text>
</svg>