<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      
      * { font-family: 'Fira Code', monospace; box-sizing: border-box; }

      .title-text {
        font-family: 'Orbitron', monospace;
        font-size: 22px;
        font-weight: 900;
        fill: #00FF9D;
        letter-spacing: 3px;
        filter: drop-shadow(0 0 8px rgba(0, 255, 157, 0.6));
      }

      .sub-text {
        font-size: 14px;
        fill: #E2E8F0;
        line-height: 1.6;
      }

      .badge-head {
        font-size: 11px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }

      .pulse-dot {
        animation: pulseDot 1.2s ease-in-out infinite alternate;
      }
      
      @keyframes pulseDot {
        0% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 8px #00FF9D); }
        100% { fill: #00F0FF; opacity: 0.3; filter: drop-shadow(0 0 2px #00F0FF); }
      }

      .glow-border {
        animation: borderGlow 4s ease-in-out infinite alternate;
      }

      @keyframes borderGlow {
        0% { stroke: #00F0FF; filter: drop-shadow(0 0 4px #00F0FF); }
        50% { stroke: #7000FF; filter: drop-shadow(0 0 8px #7000FF); }
        100% { stroke: #00FF9D; filter: drop-shadow(0 0 4px #00FF9D); }
      }

      .sheen-anim {
        animation: moveSheen 5s ease-in-out infinite alternate;
      }

      @keyframes moveSheen {
        0% { transform: translateX(-950px); }
        100% { transform: translateX(950px); }
      }

      /* SLIDE PRESENTATION CYCLER (0s -> 4s -> 8s -> 12s) */
      .slide-1 { animation: slideCycle1 12s infinite; }
      .slide-2 { animation: slideCycle2 12s infinite; }
      .slide-3 { animation: slideCycle3 12s infinite; }

      @keyframes slideCycle1 {
        0%, 30% { opacity: 1; transform: translateY(0); }
        33%, 97% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideCycle2 {
        0%, 30% { opacity: 0; transform: translateY(10px); }
        33%, 63% { opacity: 1; transform: translateY(0); }
        66%, 100% { opacity: 0; transform: translateY(10px); }
      }

      @keyframes slideCycle3 {
        0%, 63% { opacity: 0; transform: translateY(10px); }
        66%, 96% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(10px); }
      }
    </style>

    <clipPath id="hud-clip">
      <rect width="950" height="420" rx="20" />
    </clipPath>

    <linearGradient id="obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="30%" stop-color="#070B14" />
      <stop offset="70%" stop-color="#0A0F1E" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>

    <linearGradient id="glass-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7000FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#hud-clip)">
    <!-- Base Engraved Frame -->
    <rect width="950" height="420" rx="20" fill="url(#obsidian-bg)" stroke="#000000" stroke-width="4"/>
    
    <!-- Bevel Triple Stroke -->
    <rect x="3" y="3" width="944" height="414" rx="18" fill="none" stroke="#000000" stroke-width="3" opacity="0.9"/>
    <rect x="5" y="5" width="940" height="410" rx="16" fill="none" stroke="url(#glass-bevel)" stroke-width="1.8" />
    <rect x="7" y="7" width="936" height="406" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

    <!-- Moving Sheen -->
    <g class="sheen-anim">
      <rect x="0" y="0" width="450" height="420" fill="url(#sheen)"/>
    </g>

    <!-- L-Brackets -->
    <path d="M 24 24 L 90 24 M 24 24 L 24 90" class="glow-border" stroke-width="3.5" fill="none"/>
    <path d="M 926 24 L 860 24 M 926 24 L 926 90" class="glow-border" stroke-width="3.5" fill="none"/>
    <path d="M 24 396 L 90 396 M 24 396 L 24 330" class="glow-border" stroke-width="3.5" fill="none"/>
    <path d="M 926 396 L 860 396 M 926 396 L 926 330" class="glow-border" stroke-width="3.5" fill="none"/>

    <!-- Command Header -->
    <rect x="50" y="24" width="850" height="38" rx="8" fill="#020408" stroke="#000000" stroke-width="2"/>
    <rect x="51" y="25" width="848" height="36" rx="7" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="74" cy="43" r="5" class="pulse-dot" />
    <text x="92" y="47" class="badge-head">NULLA-LABS // KAPTURA VECTORIAL SVG PRESENTATION HUD (TOOL 3)</text>
    <text x="740" y="47" class="badge-head" fill="#00FF9D">[120 FPS VECTOR PLAYBACK]</text>

    <!-- MAIN SLIDE CARD CONTAINER -->
    <rect x="60" y="75" width="590" height="305" rx="14" fill="#0F172A" opacity="0.85" stroke="#00F0FF" stroke-width="1.5"/>

    <!-- SLIDE 1 -->
    <g class="slide-1" transform="translate(85, 115)">
      <text x="0" y="24" class="title-text">01. SOVEREIGN MOTION RECORDING</text>
      <text x="0" y="65" class="sub-text">Motor trascendental de captura cinemática y telemetría de ultra-alta velocidad (60–120 FPS).</text>
      <text x="0" y="100" class="sub-text">Permite procesar e integrar presentaciones sin pérdidas de rendimiento directamente en tu perfil.</text>
    </g>

    <!-- SLIDE 2 -->
    <g class="slide-2" transform="translate(85, 115)">
      <text x="0" y="24" class="title-text" fill="#00F0FF">02. ZERO-LOSS 120 FPS VECTOR ENGINE</text>
      <text x="0" y="65" class="sub-text">Exporta animaciones SVG vectoriales nativas que se reproducen en vivo dentro del README.md.</text>
      <text x="0" y="100" class="sub-text">Compatibilidad 100% nativa con GitHub sin necesidad de reproductores externos.</text>
    </g>

    <!-- SLIDE 3 -->
    <g class="slide-3" transform="translate(85, 115)">
      <text x="0" y="24" class="title-text" fill="#FFD700">03. LOCAL-FIRST CINEMATIC HUD</text>
      <text x="0" y="65" class="sub-text">Sin dependencias de red ni CDNs de terceros.</text>
      <text x="0" y="100" class="sub-text">Ejecución autónoma de máxima velocidad para presentaciones corporativas y métricas en directo.</text>
    </g>

    <!-- TELEMETRY SIDEBAR -->
    <rect x="670" y="75" width="220" height="305" rx="14" fill="#04070E" opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <text x="690" y="105" class="badge-head" fill="#00F0FF">TELEMETRY HUD</text>

    <rect x="690" y="125" width="180" height="65" rx="8" fill="#0F172A" stroke="#00FF9D" stroke-width="1.5"/>
    <text x="702" y="145" class="badge-head">FPS STABILITY</text>
    <text x="702" y="174" class="title-text" fill="#00FF9D">120.0 FPS</text>

    <rect x="690" y="205" width="180" height="65" rx="8" fill="#0F172A" stroke="#7000FF" stroke-width="1.5"/>
    <text x="702" y="225" class="badge-head">VECTOR LATENCY</text>
    <text x="702" y="254" class="title-text" fill="#00F0FF">0.42 ms</text>
  </g>
</svg>